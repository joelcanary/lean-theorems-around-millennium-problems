name: lean build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache
        run: lake exe cache get
      - name: Build
        run: lake build
      - name: Axioms of the main theorems
        run: |
          cat > Axiomas.lean <<'EOF'
          import RiemannRedheffer
          import SmithDeterminant
          import BSDParidad
          import BSDTwist
          import HodgeMathlib
          import PanopticUmbral
          import PanopticFamilia
          #print axioms Redheffer.redheffer_general
          #print axioms Smith.smith_determinant
          #print axioms BSDParidad.tunnell_par
          #print axioms BSDTwist.a_p_twist
          #print axioms Panoptic.umbral_exacto
          #print axioms PanopticFamilia.ningun_peso_lo_arregla
          EOF
          lake env lean Axiomas.lean
